[package]
name = "gitbatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Keyboard-driven TUI for batch git operations across many repositories"
readme = "README.md"
keywords = ["git", "tui", "terminal", "batch", "repositories"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
repository = "https://github.com/makibytes/gitbatch"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.34"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# NOTE: serde_yaml is archived/unmaintained upstream (deprecated since March
# 2024). It works fine for the small config file here. Checked again 2026-09:
# the two forks (serde_norway 0.9.42, last published Dec 2024; serde_yaml_ng
# 0.10.0, last published May 2024) are both stale too, so there's no clearly
# maintained alternative to move to yet. Revisit if that changes.
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
# Already pulled in transitively by ratatui (which uses it for the same
# purpose: sizing terminal cells); declared directly here so gitbatch's own
# column-truncation code can measure display width the same way ratatui does.
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
