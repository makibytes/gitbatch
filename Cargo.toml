[package]
name = "gitbatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Keyboard-driven TUI for batch git operations across many repositories"
readme = "README.md"
keywords = ["git", "tui", "terminal", "batch", "repositories"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
repository = "https://github.com/makibytes/gitbatch"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.33"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# NOTE: serde_yaml is archived/unmaintained upstream. It works fine for the
# small config file here; revisit if a maintained YAML crate becomes standard.
serde_yaml = "0.9.34"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
